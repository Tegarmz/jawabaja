<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>How Ur Dayyy? 💌</title>

  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Comic Neue', cursive;

      background:
        linear-gradient(
          rgba(255, 214, 232, 0.35),
          rgba(255, 235, 245, 0.55)
        ),
        url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRfZnCmZlg3q4E6priE7cZcBp6qtCBxFJ4NhxKVOnjOeU4oH8NviEOvrEgE&s=10')
        center / cover fixed;

      color: #555;
      overflow-x: hidden;
      position: relative;
      padding: 25px 15px 40px;
    }

    /* =========================
       BACKGROUND DECORATIONS
    ========================= */

    .decorations {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .decor {
      position: absolute;
      user-select: none;
      opacity: 0.85;
      animation: float 5s ease-in-out infinite;
    }

    .flower1 {
      top: 4%;
      left: 4%;
      font-size: 55px;
      animation-delay: 0s;
    }

    .flower2 {
      top: 15%;
      right: 5%;
      font-size: 45px;
      animation-delay: 1s;
    }

    .flower3 {
      bottom: 12%;
      left: 3%;
      font-size: 48px;
      animation-delay: 2s;
    }

    .flower4 {
      bottom: 4%;
      right: 4%;
      font-size: 60px;
      animation-delay: 1.5s;
    }

    .butterfly1 {
      top: 28%;
      left: 8%;
      font-size: 35px;
      animation: butterfly 7s ease-in-out infinite;
    }

    .butterfly2 {
      top: 55%;
      right: 8%;
      font-size: 38px;
      animation: butterfly 8s ease-in-out infinite reverse;
    }

    .heart1 {
      top: 10%;
      left: 25%;
      font-size: 24px;
      animation-delay: 0.5s;
    }

    .heart2 {
      top: 40%;
      right: 20%;
      font-size: 20px;
      animation-delay: 1.5s;
    }

    .heart3 {
      bottom: 25%;
      left: 20%;
      font-size: 27px;
      animation-delay: 2s;
    }

    .heart4 {
      bottom: 10%;
      right: 25%;
      font-size: 22px;
      animation-delay: 0.8s;
    }

    .star1 {
      top: 8%;
      right: 30%;
      font-size: 20px;
      animation: sparkle 2s infinite;
    }

    .star2 {
      top: 35%;
      left: 25%;
      font-size: 18px;
      animation: sparkle 2.5s infinite;
    }

    .star3 {
      bottom: 20%;
      right: 15%;
      font-size: 25px;
      animation: sparkle 1.8s infinite;
    }

    .star4 {
      bottom: 35%;
      left: 10%;
      font-size: 17px;
      animation: sparkle 3s infinite;
    }

    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(-3deg);
      }

      50% {
        transform: translateY(-14px) rotate(3deg);
      }
    }

    @keyframes butterfly {
      0%, 100% {
        transform: translate(0, 0) rotate(-8deg);
      }

      50% {
        transform: translate(25px, -25px) rotate(8deg);
      }
    }

    @keyframes sparkle {
      0%, 100% {
        opacity: 0.25;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.3);
      }
    }

    /* =========================
       MAIN CARD
    ========================= */

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    .card {
      width: 100%;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      padding: 30px 28px;
      border-radius: 28px;

      border: 2px solid rgba(255, 255, 255, 0.8);

      box-shadow:
        0 15px 40px rgba(196, 87, 135, 0.18),
        0 0 0 8px rgba(255, 255, 255, 0.15);

      animation: cardAppear 0.8s ease;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(25px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* =========================
       HEADER
    ========================= */

    .top-decoration {
      font-size: 25px;
      letter-spacing: 5px;
      margin-bottom: 5px;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.7rem, 10vw, 4rem);
      line-height: 1;
      color: #ff69b4;
      margin: 5px 0 10px;

      text-shadow:
        2px 2px 0 #fff,
        0 4px 10px rgba(255, 105, 180, 0.2);
    }

    .subtitle {
      font-size: clamp(1rem, 4vw, 1.2rem);
      line-height: 1.5;
      margin: 0 0 25px;
      color: #666;
    }

    .subtitle strong {
      color: #ff69b4;
    }

    /* =========================
       FORM
    ========================= */

    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: 700;
      color: #e75491;
      margin: 0 0 7px 5px;
      font-size: 0.98rem;
    }

    input,
    textarea,
    select {
      display: block;
      width: 100%;
      max-width: 100%;

      padding: 13px 15px;

      border: 2px solid #ffc1d9;
      border-radius: 16px;

      font-family: 'Comic Neue', cursive;
      font-size: 16px;

      color: #555;
      background: rgba(255, 255, 255, 0.95);

      outline: none;

      transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.2s ease;
    }

    input::placeholder,
    textarea::placeholder {
      color: #aaa;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #ff69b4;

      box-shadow:
        0 0 0 4px rgba(255, 105, 180, 0.12);

      transform: translateY(-1px);
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    /* =========================
       RATING
    ========================= */

    .rating-wrapper {
      position: relative;
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;

      background-image:
        linear-gradient(45deg, transparent 50%, #ff69b4 50%),
        linear-gradient(135deg, #ff69b4 50%, transparent 50%);

      background-position:
        calc(100% - 18px) 50%,
        calc(100% - 12px) 50%;

      background-size:
        6px 6px,
        6px 6px;

      background-repeat: no-repeat;
    }

    /* =========================
       BUTTON
    ========================= */

    button {
      width: 100%;

      margin-top: 5px;
      padding: 14px 20px;

      border: none;
      border-radius: 18px;

      background: linear-gradient(
        135deg,
        #ff69b4,
        #ff8fc7
      );

      color: white;

      font-family: 'Comic Neue', cursive;
      font-size: 1.05rem;
      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 8px 18px rgba(255, 105, 180, 0.25);

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        opacity 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow:
        0 11px 23px rgba(255, 105, 180, 0.32);
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      cursor: wait;
      opacity: 0.7;
      transform: none;
    }

    /* =========================
       BOTTOM EMOJIS
    ========================= */

    .emoji {
      margin-top: 23px;
      font-size: 1.7rem;
      letter-spacing: 5px;
      animation: float 4s ease-in-out infinite;
    }

    .little-message {
      margin-top: 12px;
      color: #999;
      font-size: 0.9rem;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      position: relative;
      z-index: 2;

      margin: 22px auto 0;

      text-align: center;

      color: white;
      font-weight: 700;

      text-shadow:
        0 2px 5px rgba(120, 50, 80, 0.3);

      font-size: 0.95rem;
    }

    /* =========================
       SUCCESS MESSAGE
    ========================= */

    .success-message {
      display: none;

      margin-top: 18px;
      padding: 13px;

      border-radius: 15px;

      background: #fff0f7;
      color: #e75491;

      font-weight: 700;

      animation: cardAppear 0.4s ease;
    }

    .success-message.show {
      display: block;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      body {
        padding:
          max(18px, env(safe-area-inset-top))
          12px
          max(25px, env(safe-area-inset-bottom));
      }

      .card {
        padding: 25px 18px;
        border-radius: 24px;
      }

      .top-decoration {
        font-size: 20px;
      }

      h1 {
        font-size: 3rem;
      }

      .subtitle {
        font-size: 1rem;
        margin-bottom: 22px;
      }

      input,
      textarea,
      select {
        font-size: 16px;
        padding: 13px;
      }

      textarea {
        min-height: 130px;
      }

      button {
        min-height: 52px;
        font-size: 1rem;
      }

      /* Dekorasi dibuat sedikit lebih kecil */
      .flower1 {
        font-size: 38px;
      }

      .flower2 {
        font-size: 34px;
      }

      .flower3 {
        font-size: 35px;
      }

      .flower4 {
        font-size: 40px;
      }

      .butterfly1,
      .butterfly2 {
        font-size: 25px;
      }

      /* Hindari dekorasi terlalu dekat dengan form */
      .heart1,
      .heart2,
      .heart3,
      .heart4 {
        font-size: 18px;
      }
    }

    /* HP sangat kecil */
    @media (max-width: 360px) {

      .card {
        padding: 22px 15px;
      }

      h1 {
        font-size: 2.6rem;
      }

      .emoji {
        font-size: 1.4rem;
        letter-spacing: 2px;
      }
    }

    /* Mengurangi animasi jika user memilih reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       BACKGROUND DECORATIONS
  ========================== -->

  <div class="decorations" aria-hidden="true">

    <span class="decor flower1">🌸</span>
    <span class="decor flower2">🌷</span>
    <span class="decor flower3">🌼</span>
    <span class="decor flower4">🌸</span>

    <span class="decor butterfly1">🦋</span>
    <span class="decor butterfly2">🦋</span>

    <span class="decor heart1">💗</span>
    <span class="decor heart2">💖</span>
    <span class="decor heart3">💕</span>
    <span class="decor heart4">💗</span>

    <span class="decor star1">✨</span>
    <span class="decor star2">⭐</span>
    <span class="decor star3">✨</span>
    <span class="decor star4">🌟</span>

  </div>


  <!-- =========================
       MAIN CONTENT
  ========================== -->

  <main class="container">

    <section class="card">

      <div class="top-decoration">
        🌸 ✨ 💗 ✨ 🌸
      </div>

      <h1>How Ur Dayyy?</h1>

      <p class="subtitle">
        <strong>Haiii! 🌷</strong><br>
        How was ur day today? 💌
      </p>


      <form id="dayForm">

        <!-- Perasaan -->
        <div class="form-group">

          <label for="answerInput">
            💭 How are you feeling?
          </label>

          <input
            type="text"
            id="answerInput"
            placeholder="happy? tired? excited? tell meee 🌸"
            autocomplete="off"
            required
          >

        </div>


        <!-- Rating -->
        <div class="form-group">

          <label for="ratingInput">
            ⭐ Rate ur day
          </label>

          <div class="rating-wrapper">

            <select id="ratingInput" required>

              <option value="" disabled selected>
                Pilih rating hari ini 🌟
              </option>

              <option value="1 Bintang">
                ⭐ — not really good
              </option>

              <option value="2 Bintang">
                ⭐⭐ — kinda rough
              </option>

              <option value="3 Bintang">
                ⭐⭐⭐ — it was okay
              </option>

              <option value="4 Bintang">
                ⭐⭐⭐⭐ — pretty good!
              </option>

              <option value="5 Bintang">
                ⭐⭐⭐⭐⭐ — SUPER HAPPY! 💖
              </option>

            </select>

          </div>

        </div>


        <!-- Cerita -->
        <div class="form-group">

          <label for="storyInput">
            💌 Tell me something
          </label>

          <textarea
            id="storyInput"
            placeholder="Kalooo ada hall lucu or nyebelin buat harii ini bahkan hal yang ngerasa ga enakk bilangg siniii... 🌸💖"
          ></textarea>

        </div>


        <button type="submit" id="submitButton">
          Kirim ceritamu 💌
        </button>

      </form>


      <div
        class="success-message"
        id="successMessage"
        role="status"
      >
        💖 Terkirimmm! Semoga besok ada lebih banyak alasan buat senyum 🌸
      </div>


      <div class="emoji">
        🌸 💖 🌷 ✨ 🦋 💕
      </div>

      <div class="little-message">
        take a rest too, okay? 🫶
      </div>

    </section>

  </main>


  <footer>
    ISTIRAHATTTT 🌙💗
  </footer>


  <!-- =========================
       EMAILJS
  ========================== -->

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script>

    emailjs.init({
      publicKey: "Kls6L5CroMrasha5w"
    });


    const form = document.getElementById("dayForm");
    const button = document.getElementById("submitButton");
    const successMessage = document.getElementById("successMessage");


    form.addEventListener("submit", async function(event) {

      event.preventDefault();

      // Mencegah submit berkali-kali
      button.disabled = true;
      button.textContent = "Sendinggg... 💌";

      successMessage.classList.remove("show");


      const params = {

        answer:
          document.getElementById("answerInput").value.trim(),

        rating:
          document.getElementById("ratingInput").value,

        story:
          document.getElementById("storyInput").value.trim()

      };


      try {

        await emailjs.send(
          "service_fx94pza",
          "template_hc36g9n",
          params
        );


        // Berhasil
        successMessage.classList.add("show");

        form.reset();

        button.textContent = "Terkirimmm! 💖";


        // Kembalikan tombol setelah beberapa detik
        setTimeout(() => {

          button.disabled = false;
          button.textContent = "Kirim ceritamu 💌";

        }, 3000);


      } catch (error) {

        console.error("EmailJS Error:", error);

        alert(
          "Yahh, pesannya belum berhasil dikirim 😭\n\n" +
          "Coba cek koneksi internet lalu coba lagi yaa 💗"
        );

        button.disabled = false;
        button.textContent = "Coba kirim lagi 💌";

      }

    });

  </script>

</body>
</html>
