<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title> How Ur dayss??? 💌</title>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Comic Neue', cursive;
      background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRfZnCmZlg3q4E6priE7cZcBp6qtCBxFJ4NhxKVOnjOeU4oH8NviEOvrEgE&s=10') no-repeat center center fixed;
      background-size: cover;
      color: #444;
      text-align: center;
      padding: 30px 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      padding: 25px;
      max-width: 500px;
      margin: auto;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3em;
      color: #ff69b4;
      margin-bottom: 5px;
    }

    p {
      font-size: 1.2em;
      margin-bottom: 20px;
    }

    input, textarea, select {
      padding: 10px;
      width: 100%;
      border: 2px solid #ff69b4;
      border-radius: 15px;
      font-size: 1em;
      margin-bottom: 20px;
      background-color: #fff;
    }

    textarea {
      resize: none;
      height: 100px;
    }

    button {
      background-color: #ff69b4;
      color: white;
      padding: 12px 25px;
      border: none;
      border-radius: 20px;
      font-size: 1.2em;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    button:hover {
      transform: scale(1.1);
      background-color: #ff85c1;
    }

    .emoji {
      font-size: 1.8em;
      margin-top: 10px;
    }

    footer {
      margin-top: 30px;
      font-size: 0.9em;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>💌 HOW UR DAYSSS </h1>
    <p><strong>Hai! how ur dayss? 🌸</strong></p>

    <form id="dayForm">
      <input type="text" id="answerInput" placeholder="Perasaan hari ini happy kannnnn... 😊" required>
      <select id="ratingInput" required>
        <option value="">Ratingg buat hari ini berapa? 🌟</option>
        <option value="1 Bintang"> ⭐</option>
        <option value="2 Bintang"> ⭐⭐</option>
        <option value="3 Bintang"> ⭐⭐⭐</option>
        <option value="4 Bintang"> ⭐⭐⭐⭐</option>
        <option value="5 Bintang"> ⭐⭐⭐⭐⭐</option>
      </select>
      <textarea id="storyInput" placeholder="kaloo ada cerita or something buat hari ini bisaa tulis disini......🌸 💖 🌷 🌈 🦋 💬"></textarea>
      <button type="submit"> semoga bsokkk dan besoknya lagi terus happyy... 💌</button>
    </form>

    <div class="emoji">🌸 💖 🌷 🌈 🦋</div>
  </div>

  <footer>
    ISTIRAHATTTT
  </footer>

  <!-- Menggunakan library versi terbaru -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script>
    // Diinisialisasi dengan Public Key barumu
    emailjs.init("Kls6L5CroMrasha5w"); 

    document.getElementById("dayForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const params = {
        answer: document.getElementById("answerInput").value,
        rating: document.getElementById("ratingInput").value,
        story: document.getElementById("storyInput").value
      };

      // Mengirim menggunakan Service ID dan Template ID barumu yang sudah di-reconnect
      emailjs.send("service_fx94pza", "template_hc36g9n", params)
      .then(function() {
        alert("i hope tomorrow is better than today ❤️");
        document.getElementById("dayForm").reset();
      }, function(error) {
        alert("❌ Gagal mengirim pesan: " + JSON.stringify(error));
      });
    });
  </script>

</body>
</html>
